    destination-path: C:/endline-secrets/mainnet/MM_PRIVATE_KEY
  - template-content: '{{ range listSecrets "031c2321-2111-42c6-b94a-a629b8025580" "mainnet" "/" `{"expandSecretReferences": false}` }}{{ if eq .Key "MM_API_KEY" }}{{ .Value }}{{ end }}{{ end }}'
