infisical:
  address: https://app.infisical.com
auth:
  type: universal-auth
  config:
    client-id: C:/infisical/client-id
    client-secret: C:/infisical/client-secret
    remove_client_secret_on_read: false
templates:
  - template-content: '{{ range listSecrets "031c2321-2111-42c6-b94a-a629b8025580" "testnet" "/" `{"expandSecretReferences": false}` }}{{ if eq .Key "RELAYER_PRIVATE_KEY" }}{{ .Value }}{{ end }}{{ end }}'
    destination-path: C:/endline-secrets/testnet/RELAYER_PRIVATE_KEY
  - template-content: '{{ range listSecrets "031c2321-2111-42c6-b94a-a629b8025580" "testnet" "/" `{"expandSecretReferences": false}` }}{{ if eq .Key "MM_PRIVATE_KEY" }}{{ .Value }}{{ end }}{{ end }}'
