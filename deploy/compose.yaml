name: endline

x-app: &app
  image: endline-app
  platform: linux/amd64
  build: { context: .., dockerfile: deploy/Dockerfile, target: app }
  restart: unless-stopped

services:
  relay:
    <<: *app
    command: pnpm --filter @endline/relay start
    environment: [NETWORK_ID, RELAYER_ACCOUNT_ID, RELAYER_PRIVATE_KEY, MM_API_KEYS, FAUCET, ONECLICK_JWT, APP_ORIGINS, PORT=8787, DATA_DIR=/data, TRUST_PROXY=true]
    volumes: [relay-data:/data]
  mm:
    <<: *app
    command: pnpm --filter @endline/mm start
    environment: [NETWORK_ID, MM_ACCOUNT_ID, MM_PRIVATE_KEY, MM_API_KEY, ALERT_WEBHOOK_URL, RELAY_WS_URL=ws://relay:8787/mm]
    depends_on: [relay]
  lister:
    <<: *app
    command: pnpm --filter @endline/mm start list
    environment: [NETWORK_ID, MM_ACCOUNT_ID, MM_PRIVATE_KEY]
  monitor:
    <<: *app
    command: pnpm --filter @endline/mm start monitor
    environment: [NETWORK_ID, RELAYER_ACCOUNT_ID, MM_ACCOUNT_ID, ALERT_WEBHOOK_URL, "HEALTH_URL=${HEALTH_URL:-http://web/health}"]
  proposer:
    <<: *app
    command: pnpm --filter @endline/mm start propose
    environment: [NETWORK_ID, ORACLE_ACCOUNT_ID, ORACLE_PRIVATE_KEY]
  web:
    image: endline-web
    platform: linux/amd64
    build: { context: .., dockerfile: deploy/Dockerfile, target: web }
    restart: unless-stopped
    depends_on: [relay]
  logs:
    image: amir20/dozzle:v11.4.2@sha256:08cd5230e21e364241f3dcf26191f293166f7835654eb7e41168b9c685f0947b
    restart: unless-stopped
    environment:
      DOZZLE_FILTER: label=com.docker.compose.project=endline
      DOZZLE_ENABLE_ACTIONS: "true"
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_AUTH_HEADER_USER: Cf-Access-Authenticated-User-Email
      DOZZLE_AUTH_HEADER_EMAIL: Cf-Access-Authenticated-User-Email
      DOZZLE_AUTH_HEADER_NAME: Cf-Access-Authenticated-User-Email
    volumes: [/var/run/docker.sock:/var/run/docker.sock:ro]
  tunnel:
    image: cloudflare/cloudflared:2026.10.5@sha256:1b1d34d0a9c0bfca9de72db8460d328db3f19edd2b96169114e3e893a97bbe53
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment: [TUNNEL_TOKEN]
    depends_on: [web]
    networks: { default: { ipv4_address: 10.86.86.86 } }

networks:
  default: { ipam: { config: [{ subnet: 10.86.86.0/24, ip_range: 10.86.86.128/25 }] } }

volumes:
  relay-data: {}
