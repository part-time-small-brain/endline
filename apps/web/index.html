<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#dee3ea" />
    <meta name="description" content="Bet on BTC and ETH going up or down. Fund from any chain, max loss is what you pay." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M5 12a7 7 0 0 1 14 0z' fill='%2312B886'/%3E%3Cpath d='M5 12a7 7 0 0 0 14 0z' fill='%23F0506E'/%3E%3Crect x='1' y='11' width='22' height='2' rx='1' fill='%230E1420'/%3E%3C/svg%3E" />
    <title>near·options</title>
    <script>
      (function () {
      try { var theme = localStorage.getItem("theme"); } catch (e) {}
      theme = theme === "light" || theme === "dark" ? theme : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      var near = location.pathname.replace(/\/+$/, "") !== "";
      document.documentElement.dataset.theme = theme;
      if (near) document.documentElement.dataset.look = "near";
      document.querySelector('meta[name="theme-color"]').content = near ? "#0a0a0a" : theme === "dark" ? "#000000" : "#dee3ea";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
